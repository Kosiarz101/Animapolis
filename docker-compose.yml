services:
  employee:
    image: animapolis/employee
    container_name: employee
    ports:
      - "8011:8011"
    environment:
      SPRING_PROFILE_ACTIVE: "dev"
      SPRING_CONFIG_IMPORT: "configserver:http://config:8099/"
      SPRING_CLOUD_STEAM_KAFKA_BINDER_BROKERS: "kafka:9092"
    extends:
      file: docker-compose.base.yml
      service: base_service

  healthcare:
    image: animapolis/healthcare
    container_name: healthcare
    ports:
      - "8012:8012"
    environment:
      SPRING_PROFILE_ACTIVE: "dev"
      SPRING_CONFIG_IMPORT: "configserver:http://config:8099/"
      SPRING_CLOUD_STEAM_KAFKA_BINDER_BROKERS: "kafka:9092"
    extends:
      file: docker-compose.base.yml
      service: base_service

  config:
    image: animapolis/config
    container_name: config
    ports:
      - "8099:8099"
    depends_on:
      - kafka
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8099/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    extends:
      file: docker-compose.base.yml
      service: base_all
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: "https://github.com/Kosiarz101/Animapolis.git"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  postgres:
    image: postgres:18.6-alpine3.24
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: animapass123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./dev/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql
    extends:
      file: docker-compose.base.yml
      service: base_all

  kafka:
    image: 'apache/kafka:4.3.1'
    container_name: kafka
    restart: always
    ports:
      - '9092:9092'
    extends:
      file: docker-compose.base.yml
      service: base_all
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  redis:
    image: redis:8.10.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    extends:
      file: docker-compose.base.yml
      service: base_all

networks:
  animapolis_network:
volumes:
  postgres_data:
  redis_data: