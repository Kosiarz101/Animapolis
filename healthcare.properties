# Spring
spring.mvc.problemdetails.enabled=true
spring.cloud.bus.enabled=true
spring.cloud.stream.kafka.binder.brokers=localhost:9092
management.endpoints.web.exposure.include=health,refresh,busrefresh
management.endpoint.health.probes.enabled=true

# Server
server.port=8012

# Database
spring.datasource.url=jdbc:h2:file:./healthcare_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=notrealpassword
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.registry-fetch-interval-seconds=30
eureka.instance.prefer-ip-address=true
eureka.client.refresh.enable=false

# Logging
logging.pattern.correlation=[%X{traceId:-},%X{spanId:-}] 
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

management.tracing.enabled=true
management.tracing.baggage.correlation.enabled=true
management.tracing.sampling.probability=1
management.tracing.tracer.type=otel
