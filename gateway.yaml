# Spring
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: read_only

# Server
server:
  port: 8098

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
    refresh:
      enable: false
  instance:
    prefer-ip-address: true

# Spring
spring:
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
    gateway:
      server:
        webflux:
          routes:
            # employee
            - id: employee-strip-prefix
              uri: lb://EMPLOYEE
              predicates:
                - Path=/employee/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@headerRateLimiter}"
                    key-resolver: "#{@defaultKeyResolver}"

            # healthcare
            - id: healthcare-stripi-prefix
              uri: lb://HEALTHCARE
              predicates:
                - Path=/healthcare/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@headerRateLimiter}"
                    key-resolver: "#{@defaultKeyResolver}"
