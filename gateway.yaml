# Spring
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: read_only

# Server
server:
  port: 8098

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 30
  instance:
    prefer-ip-address: true

# Spring
spring:
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
    gateway:
      server:
        webflux:
          routes:
            - id: employee
              uri: lb://EMPLOYEE
              predicates:
                - Path=/employee/employee/**
              filters:
                - StripPrefix=1
            - id: employment-contract
              uri: lb://EMPLOYEE
              predicates:
                - Path=/employee/employment-contract/**
              filters:
                - StripPrefix=1
            - id: healthcare
              uri: lb://HEALTHCARE
              predicates:
                - Path=/healthcare/prescription
              filters:
                - StripPrefix=1
